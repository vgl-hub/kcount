name: Validate

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: ".github/workflows/val.sh"
          - os: ubuntu-latest
            command: ".github/workflows/val.sh"
            chmod: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
            submodules: recursive
    - if: matrix.os == 'macos-latest'
      name: Build (macOS)
      run: |
        brew install htslib
        HTSLIB_PREFIX=$(brew --prefix htslib)

        INCLUDE_DIR="-I$HTSLIB_PREFIX/include"
        LDFLAGS="-L$HTSLIB_PREFIX/lib"

        make CFLAGS="$INCLUDE_DIR" LDFLAGS="$LDFLAGS" all -j
    - if: matrix.os == 'ubuntu-latest'
      name: Build
      run: |
        sudo apt-get install libhts-dev
        make all -j
    - name: Validate
      run: |
        chmod +x .github/workflows/val.sh
        ${{ matrix.command }}
